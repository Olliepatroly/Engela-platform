name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Build Worker — verify (OpenNext)
        # Build-only check; actual deploys are in deploy.yml
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://app.engelahealth.co.uk
          NEXT_PUBLIC_MARKETING_URL: https://engelahealth.co.uk
          NEXT_PUBLIC_ENVIRONMENT: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
